<style>
/* Layout: uma coluna de leitura, cabeçalho de rodada no topo, progresso e filtros colados abaixo, barra de ações fixa no rodapé. */
:root {
  --bg: #f4f6f7;
  --surface: #ffffff;
  --surface-2: #eaeff1;
  --ink: #16242b;
  --ink-2: #4a5b64;
  --line: #d3dcdf;
  --accent: #0b6e7f;
  --accent-ink: #ffffff;
  --pass: #1b7a43;   --pass-bg: #e1f3e8;
  --fail: #b3261e;   --fail-bg: #fbe5e3;
  --block: #8a5a00;  --block-bg: #fbefd2;
  --skip: #55626a;   --skip-bg: #e6eaec;
  --pend: #3a4d57;   --pend-bg: #ffffff;
  --focus: #0b6e7f;
  --font: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f181c; --surface: #162328; --surface-2: #1d2d33; --ink: #e5eef1; --ink-2: #9db0b8;
    --line: #2b3e46; --accent: #4cc0d3; --accent-ink: #062228;
    --pass: #6fd49a; --pass-bg: #163a27; --fail: #ff9b92; --fail-bg: #43201d;
    --block: #f2c35c; --block-bg: #3d3010; --skip: #a8b6bd; --skip-bg: #25353b;
    --pend: #b9c9cf; --pend-bg: #162328; --focus: #4cc0d3; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f181c; --surface: #162328; --surface-2: #1d2d33; --ink: #e5eef1; --ink-2: #9db0b8;
  --line: #2b3e46; --accent: #4cc0d3; --accent-ink: #062228;
  --pass: #6fd49a; --pass-bg: #163a27; --fail: #ff9b92; --fail-bg: #43201d;
  --block: #f2c35c; --block-bg: #3d3010; --skip: #a8b6bd; --skip-bg: #25353b;
  --pend: #b9c9cf; --pend-bg: #162328; --focus: #4cc0d3; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 20px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 1.5rem; line-height: 1.2; margin: 0 0 4px; text-wrap: balance; }
h2 { font-size: 1.05rem; margin: 0; text-wrap: balance; }
.sub { color: var(--ink-2); margin: 0 0 16px; font-size: .9rem; }
.mono { font-family: var(--mono); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.session { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 12px; }
.session label { display: grid; gap: 4px; font-size: .78rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); min-width: 0; }
.session input, .filters select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0; }
details.prep { margin-bottom: 12px; }
details.prep > summary { cursor: pointer; font-weight: 600; }
details.prep h3 { font-size: .8rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); margin: 14px 0 4px; }
details.prep ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; overflow-wrap: anywhere; }
.progress { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 10px 0; display: flex; }
.progress span { display: block; height: 100%; }
.counters { display: flex; flex-wrap: wrap; gap: 8px; }
.counter { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-weight: 600; }
.counter[aria-pressed="true"] { outline: 2px solid var(--accent); }
.counter .n { font-variant-numeric: tabular-nums; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 14px 0 6px; align-items: end; }
.filters label { display: grid; gap: 3px; font-size: .75rem; color: var(--ink-2); font-weight: 600; min-width: 0; }
.shown { color: var(--ink-2); font-size: .85rem; margin: 6px 0 14px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:hover { filter: brightness(1.06); }
.banner { background: var(--block-bg); color: var(--block); border: 1px solid var(--block); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-weight: 500; }
.group { margin-top: 26px; }
.group > header { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.group .gid { font-family: var(--mono); font-weight: 600; color: var(--accent); }
.group .gcount { margin-left: auto; color: var(--ink-2); font-size: .85rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-left-width: 6px; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
.card[data-status="pass"] { border-left-color: var(--pass); }
.card[data-status="fail"] { border-left-color: var(--fail); }
.card[data-status="blocked"] { border-left-color: var(--block); }
.card[data-status="skipped"] { border-left-color: var(--skip); }
.card[data-status="pending"] { border-left-color: var(--line); }
.card h2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.card .cid { font-family: var(--mono); font-size: .85rem; color: var(--accent); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
.chip { font-size: .72rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; background: var(--surface-2); color: var(--ink-2); border-radius: 4px; padding: 2px 8px; }
.chip.layer { color: var(--accent); }
.cols { display: grid; gap: 10px 20px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .cols { grid-template-columns: 1fr 1.2fr 1fr; } }
.cols section { min-width: 0; }
.cols h3 { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 4px; }
.cols ul, .cols ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; overflow-wrap: anywhere; }
.note { font-size: .85rem; color: var(--ink-2); margin: 10px 0 0; overflow-wrap: anywhere; }
.results { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.rb { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.rb[aria-pressed="true"][data-r="pass"] { background: var(--pass-bg); color: var(--pass); border-color: var(--pass); }
.rb[aria-pressed="true"][data-r="fail"] { background: var(--fail-bg); color: var(--fail); border-color: var(--fail); }
.rb[aria-pressed="true"][data-r="blocked"] { background: var(--block-bg); color: var(--block); border-color: var(--block); }
.rb[aria-pressed="true"][data-r="skipped"] { background: var(--skip-bg); color: var(--skip); border-color: var(--skip); }
textarea { margin-top: 10px; min-height: 64px; resize: vertical; }
textarea.expected { border-color: var(--fail); }
.hint { font-size: .8rem; color: var(--fail); margin-top: 4px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 5;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar .in { max-width: 920px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar .msg { color: var(--ink-2); font-size: .85rem; margin-left: auto; min-width: 0; }
.export { margin-top: 12px; }
.export textarea { min-height: 160px; font-family: var(--mono); font-size: .8rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

const SCENARIOS = [{"id": "CT-002.1", "storyId": "US-002", "requirements": ["FR-1", "FR-2"], "title": "Banco recusa chave de evento fora do padrão", "layer": "integration", "type": "negativo", "nfr": null, "heuristic": null, "priority": "alta", "preconditions": ["Banco local com o baseline aplicado; psql conectado como dono do banco", "Funil «Pedidos Bella» existente (anotar PIPELINE_ID e ORG_ID)"], "steps": ["Executar insert into crm_pipeline_events (organization_id, pipeline_id, key, label) values ('<ORG_ID>','<PIPELINE_ID>','Compra Final','Compra')", "Executar o mesmo insert com key 'compra-final'", "Executar o mesmo insert com key '1compra'"], "expectedResult": ["Os três comandos falham com violação de check constraint (chave só aceita minúsculas, números e _, começando por letra)", "select count(*) from crm_pipeline_events devolve 0"], "automatable": true, "notes": ""}, {"id": "CT-002.2", "storyId": "US-002", "requirements": ["FR-1"], "title": "Banco exige campo do valor e unidade juntos", "layer": "integration", "type": "negativo", "nfr": null, "heuristic": null, "priority": "media", "preconditions": ["Mesmo ambiente do CT-002.1"], "steps": ["Executar insert com key 'x1', label 'X', value_path 'value' e value_unit nulo", "Executar insert com key 'x2', label 'X', value_path nulo e value_unit 'reais'", "Executar insert com key 'x3', label 'X', value_path 'value' e value_unit 'dolares'"], "expectedResult": ["Os três falham por check constraint", "Nenhuma linha é criada"], "automatable": true, "notes": ""}, {"id": "CT-002.3", "storyId": "US-002", "requirements": ["FR-2"], "title": "Banco recusa a mesma chave duas vezes no mesmo funil, mas aceita em outro", "layer": "integration", "type": "alternativo", "nfr": null, "heuristic": null, "priority": "media", "preconditions": ["Dois funis na organização A: «Pedidos Bella» e «Agenda»"], "steps": ["Inserir key 'compra' no funil «Pedidos Bella»", "Inserir key 'compra' de novo no mesmo funil", "Inserir key 'compra' no funil «Agenda»"], "expectedResult": ["O segundo insert falha com erro de chave duplicada (23505)", "O primeiro e o terceiro inserts passam"], "automatable": true, "notes": ""}, {"id": "CT-002.4", "storyId": "US-002", "requirements": ["FR-1"], "title": "Instalação nova não traz nenhum evento pronto", "layer": "e2e", "type": "sucesso", "nfr": null, "heuristic": "Visibilidade do estado do sistema", "priority": "alta", "preconditions": ["Banco novo, recém-instalado (sem nenhum evento cadastrado)", "Funil «Pedidos Bella» recém-criado, sem ter cadastrado nada"], "steps": ["Entrar como gerente@teste.local", "Abrir Configurações › Funis › Etapas do funil do funil «Pedidos Bella»", "Rolar até a seção «Para onde o card vai em cada evento»"], "expectedResult": ["A seção mostra a lista vazia, sem nenhum evento pré-cadastrado", "Há uma forma visível de cadastrar o primeiro evento"], "automatable": false, "notes": ""}, {"id": "CT-002.5", "storyId": "US-002", "requirements": ["FR-1"], "title": "Atualizar um banco que já tem dados não quebra", "layer": "integration", "type": "alternativo", "nfr": null, "heuristic": null, "priority": "alta", "preconditions": ["Banco com a tabela já criada e 5 eventos cadastrados", "Cópia do baseline.sql da versão em teste"], "steps": ["Reaplicar o baseline.sql inteiro no banco pelo psql, sem a opção de parar no primeiro erro", "Contar de novo os eventos: select count(*) from crm_pipeline_events"], "expectedResult": ["A reaplicação termina sem erro de objeto já existente", "A contagem continua 5 e os dados de cada evento estão idênticos"], "automatable": true, "notes": ""}, {"id": "CT-003.1", "storyId": "US-003", "requirements": ["FR-1"], "title": "Gerente de outra organização não lista os eventos do funil", "layer": "integration", "type": "nfr", "nfr": "seguranca", "heuristic": null, "priority": "alta", "preconditions": ["Evento «purchase» cadastrado no funil «Pedidos Bella» da organização A", "Logado como gerente-b@teste.local (organização B)"], "steps": ["com o cookie de sessão do gerente (ver «Como chamar a API do app»), enviar GET {CRM}/api/v1/pipelines/{id do funil da A}/events"], "expectedResult": ["Resposta 404 (funil não encontrado)", "Nenhum evento da organização A aparece no corpo"], "automatable": true, "notes": ""}, {"id": "CT-003.2", "storyId": "US-003", "requirements": ["FR-1"], "title": "Gerente de outra organização não cria evento no funil alheio", "layer": "integration", "type": "nfr", "nfr": "seguranca", "heuristic": null, "priority": "alta", "preconditions": ["Logado como gerente-b@teste.local", "Funil «Pedidos Bella» da A sem o evento «intruso»"], "steps": ["com o cookie de sessão do gerente (ver «Como chamar a API do app»), enviar POST {CRM}/api/v1/pipelines/{id do funil da A}/events com o corpo {\"key\":\"intruso\",\"label\":\"Intruso\"}", "Entrar como gerente@teste.local e abrir a seção de eventos do funil"], "expectedResult": ["O POST devolve 404", "O evento «intruso» não existe no funil da organização A"], "automatable": true, "notes": ""}, {"id": "CT-003.3", "storyId": "US-003", "requirements": ["FR-1"], "title": "Leitura direta no banco como usuário da outra organização devolve zero linhas", "layer": "integration", "type": "nfr", "nfr": "seguranca", "heuristic": null, "priority": "alta", "preconditions": ["Um evento em cada organização (A: purchase; B: purchase)", "JWT de gerente-b@teste.local (copiar do cookie de sessão)"], "steps": ["Enviar GET {SUPABASE}/rest/v1/crm_pipeline_events?select=* com a anon key e o cabeçalho Authorization: Bearer <JWT da B>", "Repetir com o JWT de gerente@teste.local (A)"], "expectedResult": ["Com o JWT da B, só o evento da organização B aparece", "Com o JWT da A, só o evento da organização A aparece"], "automatable": true, "notes": ""}, {"id": "CT-004.1", "storyId": "US-004", "requirements": ["FR-7"], "title": "Banco aceita o mesmo event_id em pedidos diferentes e recusa no mesmo pedido", "layer": "integration", "type": "alternativo", "nfr": null, "heurist const PREP = [{"titulo": "Ambiente", "itens": ["Stack local (ou homologação) com banco novo: baseline.sql aplicado + bootstrap-owner, sem variáveis opcionais (por exemplo sem RESEND_API_KEY). Daqui em diante {CRM} é o endereço do app, por exemplo http://localhost:3000.", "Organização A «Loja Teste A» e organização B «Loja Teste B», cada uma com o seu dono.", "Na organização A: gerente@teste.local (papel gerente), atendente@teste.local (papel atendente) e leitor@teste.local (papel visualizador). Na B: gerente-b@teste.local (gerente)."]}, {"titulo": "Funil de referência (organização A)", "itens": ["Funil «Pedidos Bella» com estas etapas, nesta ordem: 1 Conversas · 2 Chamar humano · 3 Visitou o cardápio · 4 Viu um item · 5 Carrinho · 6 Revisão · 7 Compras (ganho) · 8 Cancelado (perda).", "Um campo declarado no funil: «Observação», chave observacao.", "Contato «Cliente Teste 01» (telefone +55 11 90000-0001) com um pedido aberto na etapa Conversas do funil «Pedidos Bella». Anotar o id do pedido (lead_id) lendo-o na resposta de GET /api/v1/leads ou no endereço do card; daqui em diante L1. Quando um cenário pedir «um pedido novo», criar outro contato «Cliente Teste NN» com pedido aberto em Conversas e anotar o id."]}, {"titulo": "Eventos de referência (cadastro à mão, nada vem pronto)", "itens": ["Cadastrar na tela (Configurações › Funis › Etapas do funil › «Para onde o card vai em cada evento») ou pelo POST do CT-014.1, uma linha por evento: page_view «Visitou o cardápio» → destino Visitou o cardápio · view_item «Viu um item» → Viu um item, guardar em ultimo_item · cart_sync «Carrinho atualizado» → Carrinho, guardar em carrinho · begin_checkout «Revisou o pedido» → Revisão, guardar em revisao, campo do valor value em reais · purchase «Compra» → Compras, guardar em compra, campo do valor value em reais, chave de repetição order_id, respeitar movimento manual DESLIGADO.", "Os outros ficam com «respeitar movimento manual» LIGADO (padrão). Os cenários que precisam de um evento a mais dizem qual nas pré-condições."]}, {"titulo": "Como chamar o MCP", "itens": ["Criar um token de API da organização A com os escopos de leitura e de escrita do MCP (aparece uma vez, começa com dsk_). Guardar como TOKEN_A; fazer o mesmo na B (TOKEN_B).", "Chamada: POST {CRM}/api/mcp com os cabeçalhos Authorization: Bearer TOKEN_A, Content-Type: application/json e Accept: application/json, text/event-stream, e o corpo {\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"<ferramenta>\",\"arguments\":{...}}}. Pode ser feita no Postman, no Insomnia ou no MCP Inspector."]}, {"titulo": "Como chamar a API do app (cadastro)", "itens": ["As rotas /api/v1/pipelines/{id}/events usam a sessão do navegador. Entrar no app como o usuário do cenário, copiar o cookie de sessão (DevTools › Application › Cookies) e enviá-lo no cabeçalho Cookie do Postman. {id} é o id do funil «Pedidos Bella», visível no endereço de Configurações › Funis."]}, {"titulo": "Como conferir o resultado", "itens": ["Etapa, valor e campos do pedido: abrir o card (ou GET /api/v1/leads/{lead_id}: stage, value_cents, custom_fields).", "Histórico: linha do tempo do card. Cada evento aceito aparece como «Registro de uma integração»; mudança de etapa aparece como mudança de etapa feita pelo sistema.", "Banco (quando o cenário pedir): psql no banco local, tabelas crm_pipeline_events, crm_lead_activities e api_audit_log."]}];
const KEY = "test-run:" + FEATURE;
const R = {
  pass: { label: "Passou", glyph: "✓", color: "var(--pass)" },
  fail: { label: "Falhou", glyph: "✕", color: "var(--fail)" },
  blocked: { label: "Bloqueado", glyph: "⊘", color: "var(--block)" },
  skipped: { label: "Não executado", glyph: "↷", color: "var(--skip)" },
  pending: { label: "Pendente", glyph: "○", color: "var(--line)" }
};
const ORDER = ["pass", "fail", "blocked", "skipped", "pending"];
const LAYER = { integration: "integração", e2e: "e2e" };
const TYPE = { sucesso: "sucesso", alternativo: "alternativo", negativo: "negativo", nfr: "não funcional" };
const PRIO = { alta: "alta", media: "média", baixa: "baixa" };

let state = { session: { by: "", at: "", env: "", build: "" }, results: {}, specIds: [] };
let filters = { story: "", layer: "", type: "", prio: "", status: "" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const s = JSON.parse(raw); if (s && s.results) state = Object.assign(state, s); }
  } catch (e) {}
  if (!state.session.at) state.session.at = today();
}
function save() {
  try { state.specIds = SCENARIOS.map((s) => s.id); localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
function res(id) { return (state.results[id] && state.results[id].result) || "pending"; }
function counts() {
  const c = { pass: 0, fail: 0, blocked: 0, skipped: 0, pending: 0 };
  SCENARIOS.forEach((s) => { c[res(s.id)]++; });
  return c;
}

function renderPrep() {
  $("prep").innerHTML = PREP.map((b) => "<h3>" + esc(b.titulo) + "</h3><ul>" + b.itens.map((i) => "<li>" + esc(i) + "</li>").join("") + "</ul>").join("");
}

function renderBanner() {
  const saved = state.specIds || [];
  const current = SCENARIOS.map((s) => s.id);
  if (!saved.length) { $("banner").innerHTML = ""; return; }
  const added = current.filter((id) => saved.indexOf(id) < 0);
  const gone = saved.filter((id) => current.indexOf(id) < 0);
  if (added.length || gone.length) {
    $("banner").innerHTML = '<div class="banner">A spec mudou desde a última vez que você abriu esta rodada: ' + added.length + " cenário(s) novo(s) ficam pendentes" + (gone.length ? " e " + gone.length + " cenário(s) saíram da spec (os resultados deles continuam guardados, mas não são exportados)" : "") + ".</div>";
  } else $("banner").innerHTML = "";
}

function renderTop() {
  const c = counts(), total = SCENARIOS.length;
  const done = total - c.pending;
  $("progress").innerHTML = ORDER.filter((k) => k !== "pending").map((k) => '<span style="width:' + (c[k] / total * 100) + '%;background:' + R[k].color + '"></span>').join("");
  $("progress").setAttribute("aria-label", "Executados: " + done + " de " + total);
  $("counters").innerHTML = ORDER.map((k) => '<button type="button" class="counter" data-k="' + k + '" aria-pressed="' + (filters.status === k) + '"><span aria-hidden="true" style="color:' + R[k].color + '">' + R[k].glyph + '</span>' + R[k].label + ' <span class="n">' + c[k] + '</span></button>').join("") + '<span class="counter" style="cursor:default" aria-live="polite"><span class="n">' + done + "/" + total + "</span> executados</span>";
  document.querySelectorAll(".counter[data-k]").forEach((b) => b.addEventListener("click", () => { filters.status = filters.status === b.dataset.k ? "" : b.dataset.k; syncFilterControls(); render(); }));
}

function opt(v, l, sel) { return '<option value="' + esc(v) + '"' + (sel ? " selected" : "") + ">" + esc(l) + "</option>"; }
function buildFilters() {
  const stories = []; SCENARIOS.forEach((s) => { if (stories.indexOf(s.storyId) < 0) stories.push(s.storyId); });
  $("f-story").innerHTML = opt("", "Todas") + stories.map((x) => opt(x, x)).join("");
  $("f-layer").innerHTML = opt("", "Todas") + Object.keys(LAYER).map((k) => opt(k, LAYER[k])).join("");
  $("f-type").innerHTML = opt("", "Todos") + Object.keys(TYPE).map((k) => opt(k, TYPE[k])).join("");
  $("f-prio").innerHTML = opt("", "Todas") + Object.keys(PRIO).map((k) => opt(k, PRIO[k])).join("");
  $("f-status").innerHTML = opt("", "Todos") + ORDER.map((k) => opt(k, R[k].label)).join("");
}
function syncFilterControls() {
  $("f-story").value = filters.story; $("f-layer").value = filters.layer; $("f-type").value = filters.type; $("f-prio").value = filters.prio; $("f-status").value = filters.status;
}
function passes(s) {
  return (!filters.story || s.storyId === filters.story) && (!filters.layer || s.layer === filters.layer) && (!filters.type || s.type === filters.type) && (!filters.prio || s.priority === filters.prio) && (!filters.status || res(s.id) === filters.status);
}

function li(a) { return a.map((x) => "<li>" + esc(x) + "</li>").join(""); }
function card(s) {
  const st = res(s.id), cur = state.results[s.id] || {};
  const need = (st === "fail" || st === "blocked") && !(cur.description || "").trim();
  const chips = ['<span class="chip layer">' + LAYER[s.layer] + "</span>", '<span class="chip">' + TYPE[s.type] + (s.nfr ? " · " + esc(s.nfr) : "") + "</span>", '<span class="chip">prioridade ' + PRIO[s.priority] + "</span>"]
    .concat(s.requirements.map((r) => '<span class="chip">' + esc(r) + "</span>")).join("");
  const btns = ["pass", "fail", "blocked", "skipped"].map((k) => '<button type="button" class="rb" data-id="' + s.id + '" data-r="' + k + '" aria-pressed="' + (st === k) + '"><span aria-hidden="true">' + R[k].glyph + "</span>" + R[k].label + "</button>").join("");
  const notes = [s.heuristic ? "Heurística: " + s.heuristic : "", s.notes ? "Nota: " + s.notes : "", s.automatable ? "Automatizável" : ""].filter(Boolean);
  return '<article class="card" data-status="' + st + '" id="' + s.id + '"><h2><span class="cid">' + s.id + "</span>" + esc(s.title) + '</h2><div class="chips">' + chips + '</div>' +
    '<div class="cols"><section><h3>Pré-condições</h3><ul>' + li(s.preconditions) + '</ul></section><section><h3>Steps para reproduzir</h3><ol>' + li(s.steps) + '</ol></section><section><h3>Resultado esperado</h3><ul>' + li(s.expectedResult) + "</ul></section></div>" +
    (notes.length ? '<p class="note">' + notes.map(esc).join(" · ") + "</p>" : "") +
    '<div class="results" role="group" aria-label="Resultado de ' + s.id + '">' + btns + "</div>" +
    '<textarea id="obs-' + s.id + '" data-id="' + s.id + '" class="obs' + (need ? " expected" : "") + '" placeholder="o que aconteceu, evidência, link do bug">' + esc(cur.description || "") + "</textarea>" +
    (need ? '<div class="hint">Anote o que aconteceu (não impede o registro).</div>' : "") + "</article>";
}

function render() {
  renderTop(); renderBanner();
  const list = SCENARIOS.filter(passes);
  $("shown").textContent = "Mostrando " + list.length + " de " + SCENARIOS.length + " cenários.";
  const by = {}; list.forEach((s) => { (by[s.storyId] = by[s.storyId] || []).push(s); });
  $("list").innerHTML = Object.keys(by).map((sid) => {
    const all = SCENARIOS.filter((s) => s.storyId === sid), done = all.filter((s) => res(s.id) !== "pending").length;
    return '<section class="group"><header><span class="gid">' + sid + "</span><h2>" + esc(STORY[sid] || "") + '</h2><span class="gcount">' + done + "/" + all.length + " executados</span></header>" + by[sid].map(card).join("") + "</section>";
  }).join("");
  document.querySelectorAll(".rb").forEach((b) => b.addEventListener("click", () => setResult(b.dataset.id, b.dataset.r)));
  document.querySelectorAll("textarea.obs").forEach((t) => {
    t.addEventListener("input", () => { const id = t.dataset.id; state.results[id] = Object.assign({ result: "pending" }, state.results[id], { description: t.value }); save(); });
    t.addEventListener("change", render);
  });
}
function setResult(id, r) {
  const cur = state.results[id] || { result: "pending", description: "" };
  cur.result = cur.result === r ? "pending" : r;
  state.results[id] = cur; save();
  const y = window.scrollY; render(); window.scrollTo(0, y);
  const el = document.querySelector('.rb[data-id="' + id + '"][data-r="' + r + '"]'); if (el) el.focus({ preventScroll: true });
}

function exportJson() {
  const ids = SCENARIOS.map((s) => s.id);
  const results = ids.filter((id) => res(id) !== "pending").map((id) => ({ id: id, result: res(id), description: (state.results[id].description || "").trim() }));
  return JSON.stringify({ feature: FEATURE, session: { executedBy: state.session.by || null, executedAt: state.session.at || null, environment: state.session.env || null, build: state.session.build || null }, results: results }, null, 2);
}
function exportMd() {
  const c = counts();
  let t = "# " + document.title + "\n\n" + "Testado por: " + (state.session.by || "—") + " · Data: " + (state.session.at || "—") + " · Ambiente: " + (state.session.env || "—") + " · Build: " + (state.session.build || "—") + "\n\n";
  t += "Passou " + c.pass + " · Falhou " + c.fail + " · Bloqueado " + c.blocked + " · Não executado " + c.skipped + " · Pendente " + c.pending + "\n\n| ID | Título | Status | Observação |\n|---|---|---|---|\n";
  SCENARIOS.forEach((s) => { t += "| " + s.id + " | " + s.title.replace(/\|/g, "\\|") + " | " + R[res(s.id)].label + " | " + ((state.results[s.id] && state.results[s.id].description) || "").replace(/\|/g, "\\|").replace(/\n/g, " ") + " |\n"; });
  return t;
}
function say(m) { $("msg").textContent = m; clearTimeout(say.t); say.t = setTimeout(() => { $("msg").textContent = ""; }, 6000); }
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); $("export").hidden = true; say(what + " copiado."); }
  catch (e) {
    $("export").hidden = false; const ta = $("export-text"); ta.value = text; ta.focus(); ta.select();
    say("Não foi possível copiar sozinho. O texto está selecionado: use Ctrl+C.");
  }
}

let armed = false;
function clearRound() {
  const b = $("b-clear");
  if (!armed) { armed = true; b.textContent = "Confirmar: apagar tudo"; setTimeout(() => { armed = false; b.textContent = "Limpar rodada"; }, 4000); return; }
  armed = false; b.textContent = "Limpar rodada"; state.results = {}; save(); render(); say("Rodada limpa.");
}

function bindSession() {
  const map = { "s-by": "by", "s-at": "at", "s-env": "env", "s-build": "build" };
  Object.keys(map).forEach((id) => { $(id).value = state.session[map[id]] || ""; $(id).addEventListener("input", () => { state.session[map[id]] = $(id).value; save(); }); });
}

const STORY = {"US-003": "Provar o isolamento do cadastro entre organizações", "US-013": "API de cadastro: listar eventos do funil", "US-009": "crm_track_event: repetição de negócio, estado e valor", "US-014": "API de cadastro: criar evento", "US-016": "Tela: cadastrar e editar eventos do funil", "US-017": "Tela: avisos e sinais de uso dos eventos", "US-010": "crm_track_event: movimento da etapa", "US-005": "Tratar 23505 como repetido em registrarEventosDoNegocio", "US-004": "Índice único de event_id em crm_lead_activities", "US-011": "Leitura das chaves e gates do catálogo MCP", "US-008": "crm_track_event: validação e registro dos eventos", "US-015": "API de cadastro: editar e desativar evento", "US-002": "Criar a tabela de cadastro de eventos do funil"};
load(); buildFilters(); renderPrep(); bindSession(); render(); save();
[["f-story", "story"], ["f-layer", "layer"], ["f-type", "type"], ["f-prio", "prio"], ["f-status", "status"]].forEach(([id, k]) => $(id).addEventListener("change", () => { filters[k] = $(id).value; render(); }));
$("f-clear").addEventListener("click", () => { filters = { story: "", layer: "", type: "", prio: "", status: "" }; syncFilterControls(); render(); });
$("b-json").addEventListener("click", () => copy(exportJson(), "Resultados (JSON)"));
$("b-md").addEventListener("click", () => copy(exportMd(), "Resumo (Markdown)"));
$("b-clear").addEventListener("click", clearRound);
</script>
